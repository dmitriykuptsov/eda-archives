version: "3.9"

services:
  nginx:
    #image: nginx:latest
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./static:/var/www/static
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - backend
    restart: always

  #certbot:
  #  image: certbot/certbot
  #  volumes:
  #    - ./certbot/www:/var/www/certbot
  #    - ./certbot/conf:/etc/letsencrypt
  #  entrypoint: >
  #    sh -c "trap exit TERM;
  #           while :; do
  #             certbot renew;
  #             sleep 12h & wait $${!};
  #           done"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./uploads:/storage/uploads
      - ./reports:/storage/reports
      - ./templates:/storage/templates
      - ./data:/storage/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    command: celery -A app.worker.celery worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./uploads:/storage/uploads
      - ./reports:/storage/reports
      - ./templates:/storage/templates
      - ./data:/storage/data
    depends_on:
      - redis
      - db

  redis:
    image: redis:7

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eda_archives
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
